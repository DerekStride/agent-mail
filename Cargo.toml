[package]
name = "agent-mail"
version = "0.1.0"
edition = "2021"
description = "Local Maildir message bus for coding agents"
license = "MIT"
repository = "https://github.com/DerekStride/agent-mail"

[[bin]]
name = "agent-mail"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.0"
