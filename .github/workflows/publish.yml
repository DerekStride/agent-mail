name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version-check:
    name: Verify tag matches Cargo.toml version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Extract version from Cargo.toml
        id: cargo_version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare tag and Cargo.toml version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          TAG_VERSION="${TAG#v}"
          if [ "$TAG_VERSION" != "${{ steps.cargo_version.outputs.version }}" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo.toml version (${{ steps.cargo_version.outputs.version }})"
            exit 1
          fi

  release-notes:
    name: Generate release notes
    if: startsWith(github.ref, 'refs/tags/v')
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout all tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Generate release notes
        run: python3 scripts/generate-release-notes.py --tag "$GITHUB_REF_NAME" > release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          fi

  build-macos-artifacts:
    name: Build macOS release artifacts (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - version-check
      - release-notes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-26-intel
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="agent-mail-${TAG}-${{ matrix.target }}.tar.gz"
          STAGE_DIR="dist/${{ matrix.target }}"

          mkdir -p "$STAGE_DIR"
          cp "target/${{ matrix.target }}/release/agent-mail" "$STAGE_DIR/"
          cp LICENSE.md "$STAGE_DIR/"
          cp README.md "$STAGE_DIR/"

          tar -C "$STAGE_DIR" -czf "dist/$ARCHIVE" agent-mail LICENSE.md README.md
          shasum -a 256 "dist/$ARCHIVE" | awk '{print $1}' > "dist/$ARCHIVE.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish-release-assets:
    name: Upload macOS assets to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-macos-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-release-*
          merge-multiple: true
          path: dist

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  update-homebrew-tap:
    name: Update Homebrew tap formula
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs:
      - build-macos-artifacts
      - publish-release-assets
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Skip when tap token is not configured
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN is not configured; skipping tap update"

      - name: Checkout
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v4

      - name: Download release artifacts
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          pattern: macos-release-*
          merge-multiple: true
          path: dist

      - name: Update tap repository
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ARM_SHA=$(cat "dist/agent-mail-${TAG}-aarch64-apple-darwin.tar.gz.sha256")
          INTEL_SHA=$(cat "dist/agent-mail-${TAG}-x86_64-apple-darwin.tar.gz.sha256")

          TAP_DIR=$(mktemp -d)
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/DerekStride/homebrew-tap.git" "$TAP_DIR"

          mkdir -p "$TAP_DIR/Formula"
          ./scripts/generate-homebrew-formula.sh "$VERSION" "$ARM_SHA" "$INTEL_SHA" > "$TAP_DIR/Formula/agent-mail.rb"

          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agent-mail.rb

          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date"
            exit 0
          fi

          git commit -m "agent-mail $VERSION"
          git push origin HEAD

  publish:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - version-check
      - release-notes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --verbose
